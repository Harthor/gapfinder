[project]
name = "gapfinder"
version = "0.1.0"
description = "Detecta huecos reales: ideas con demanda cruzadas contra un corpus historico de cosas ya construidas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "sentence-transformers>=6.1.0",
    "typesafe-sdk>=0.7.2",
    "wordfreq>=3.1.1",
]

[project.scripts]
gapfinder = "gapfinder.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
